name: online-auction-system

# Base stack: API + web client + optional Adminer.
# Always pair this file with a database override:
#   docker compose -f docker-compose.yml -f docker/compose.mysql.yml up -d
# The Makefile does that for you (`make up DB=mysql`).

services:
  api:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      DB_CLIENT: ${DB_CLIENT:-mysql}
      DB_HOST: db
      DB_USER: ${DB_USER:-auction_user}
      DB_PASSWORD: ${DB_PASSWORD:-auction_password}
      DB_NAME: ${DB_NAME:-auction_system}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  client:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: /api
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
